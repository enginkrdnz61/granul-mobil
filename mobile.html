<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Granül Maliyet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#22262b">
<title>Granül Üretim Maliyet Sistemi (Mobil)</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#22262b; --panel:#2a2f36; --panel-2:#30363e; --line:#3c434c;
    --text:#EDEFF1; --muted:#99a2ac; --amber:#e3a008; --amber-dim:#7a5a17;
    --seffaf:#7fd0e0; --renkli:#4fa9a0; --elteks:#c1652f; --danger:#d9534f; --ok:#5cb85c;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  .shell{ display:flex; min-height:100vh; align-items:stretch; }
  .birim-sidebar{ width:230px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line);
    padding:22px 12px; display:flex; flex-direction:column; }
  .birim-sidebar-title{ font-family:'Space Grotesk',sans-serif; font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.08em; margin:2px 0 12px 8px; }
  .birim-row{ display:flex; align-items:center; gap:2px; margin-bottom:3px; }
  .birim-row input[type=text]{ padding:8px 10px; font-size:12.5px; }
  .birim-item{ flex:1; display:block; background:none; border:none; border-radius:8px; color:var(--muted);
    text-align:left; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px;
    padding:10px 12px; cursor:pointer; transition: all .15s; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .birim-item:hover{ background:var(--panel-2); color:var(--text); }
  .birim-item.active{ background:var(--amber); color:#211a05; }
  .birim-mini-btn{ flex-shrink:0; background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:11px; padding:4px 5px; border-radius:5px; }
  .birim-mini-btn:hover{ background:var(--panel-2); color:var(--text); }
  .birim-mini-btn:disabled{ opacity:.25; cursor:default; }
  .birim-mini-btn:disabled:hover{ background:none; }
  .birim-sidebar-divider{ height:1px; background:var(--line); margin:14px 6px; }
  .birim-logo{ display:flex; justify-content:center; margin:2px 0 18px; cursor:pointer; border-radius:10px; transition:opacity .15s; }
  .birim-logo:hover{ opacity:.85; }
  .birim-logo img{ max-width:88%; height:auto; display:block; }
  .birim-clock{ text-align:center; padding:12px 10px 2px; border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600; color:var(--amber); letter-spacing:.06em; }
  .birim-clock-tarih{ font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.04em; margin-bottom:4px; text-transform:uppercase; }
  .app-area{ flex:1; min-width:0; overflow-y:auto; height:100vh; }
  .app{ max-width:1180px; margin:0 auto; padding:22px 20px 60px; }
  .topbar{ display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap; justify-content:space-between; }
  .topbar-left{ display:flex; align-items:center; gap:14px; }
  .pellet{ width:34px; height:34px; border-radius:40% 60% 55% 45%/50% 45% 55% 50%;
    background:conic-gradient(from 200deg, var(--seffaf), var(--renkli), var(--elteks), var(--seffaf));
    flex-shrink:0; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
  .topbar h1{ font-size:20px; }
  .topbar .sub{ color:var(--muted); font-size:12.5px; margin-top:2px; }
  .whoami{ font-size:12px; color:var(--muted); text-align:right; }
  .whoami b{ color:var(--text); font-family:'JetBrains Mono',monospace; }
  nav.tabs{ display:flex; gap:4px; margin-bottom:22px; border-bottom:1px solid var(--line); overflow-x:auto;
    position:sticky; top:0; z-index:30; background:var(--bg); }
  nav.tabs button{ background:none; border:none; color:var(--muted); font-family:'Space Grotesk',sans-serif;
    font-size:13.5px; font-weight:600; padding:10px 16px; cursor:pointer; white-space:nowrap;
    border-bottom:2px solid transparent; transition:color .15s, border-color .15s; }
  nav.tabs button:hover{ color:var(--text); }
  nav.tabs button.active{ color:var(--amber); border-bottom-color:var(--amber); }
  .stage-switch{ display:flex; gap:10px; margin-bottom:16px; }
  .stage-btn{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    color:var(--muted); font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    padding:12px 16px; cursor:pointer; transition: all .15s; }
  .stage-btn:hover{ color:var(--text); border-color:var(--amber-dim); }
  .stage-btn.active{ color:#211a05; background:var(--amber); border-color:var(--amber); }
  .grid{ display:grid; gap:16px; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  @media (max-width:780px){ .grid-3,.grid-2{ grid-template-columns:1fr; } }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
  .card h3{ font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .stat{ font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; }
  .stat small{ font-size:13px; color:var(--muted); font-weight:400; margin-left:6px; }
  label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:500; }
  input, select, textarea{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:7px;
    color:var(--text); padding:9px 10px; font-family:'Inter',sans-serif; font-size:13.5px; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--amber); }
  .field{ margin-bottom:13px; }
  .row{ display:flex; gap:12px; }
  .row > *{ flex:1; }
  button.btn{ background:var(--amber); color:#211a05; border:none; border-radius:7px; font-weight:700;
    font-family:'Space Grotesk',sans-serif; padding:10px 18px; cursor:pointer; font-size:13.5px; }
  button.btn:hover{ filter:brightness(1.08); }
  button.btn:disabled{ opacity:.5; cursor:not-allowed; }
  button.btn.ghost{ background:transparent; color:var(--text); border:1px solid var(--line); }
  button.btn.danger{ background:var(--danger); color:#fff; }
  button.btn.small{ padding:6px 10px; font-size:12px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase;
      letter-spacing:.05em; padding:8px 10px; border-bottom:1px solid var(--line); }
  td{ padding:9px 10px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace; font-size:12.8px; }
  td.txt{ font-family:'Inter',sans-serif; }
  tr:hover td{ background:rgba(255,255,255,.02); }
  .tag{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .tag.seffaf{ background:rgba(127,208,224,.15); color:var(--seffaf); }
  .tag.renkli{ background:rgba(79,169,160,.15); color:var(--renkli); }
  .tag.elteks{ background:rgba(193,101,47,.18); color:var(--elteks); }
  .tag.gray{ background:rgba(153,162,172,.15); color:var(--muted); }
  .tag.gunduz{ background:rgba(227,160,8,.15); color:var(--amber); }
  .tag.gece{ background:rgba(122,145,204,.18); color:#8fa3e0; }
  .tag.admin{ background:rgba(217,83,79,.15); color:#e8807d; }
  .empty{ color:var(--muted); font-size:13.5px; padding:26px 10px; text-align:center; }
  .empty b{ color:var(--text); display:block; margin-bottom:4px; font-family:'Space Grotesk',sans-serif; }
  .modal-bg{ position:fixed; inset:0; background:rgba(10,12,14,.6); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; }
  .modal h3{ font-size:16px; margin-bottom:16px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
  .toolbar{ display:flex; gap:10px; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar .field{ margin-bottom:0; min-width:150px; }
  .actions-cell{ display:flex; gap:6px; }
  .preview{ background:var(--panel-2); border:1px dashed var(--line); border-radius:8px; padding:12px; margin-top:6px; }
  .preview .line{ display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:var(--muted); }
  .preview .line b{ color:var(--text); font-family:'JetBrains Mono',monospace; font-weight:600; }
  .preview .line.total{ border-top:1px solid var(--line); margin-top:6px; padding-top:8px; }
  .preview .line.total b{ color:var(--amber); font-size:14px; }
  .note{ font-size:12px; color:var(--muted); line-height:1.5; margin-top:6px; }
  .callout{ border-left:3px solid var(--amber); background:rgba(227,160,8,.08); padding:12px 14px; border-radius:6px; font-size:13px; }
  .callout.warn{ border-left-color:var(--danger); background:rgba(217,83,79,.08); }
  .section-title{ font-size:14px; font-weight:600; margin:22px 0 10px; font-family:'Space Grotesk',sans-serif; color:var(--text); }
  .section-title:first-child{ margin-top:0; }
  .chart-wrap{ position:relative; height:260px; }
  .footer-note{ text-align:center; color:var(--muted); font-size:11.5px; margin-top:30px; }
  .gate{ max-width:480px; margin:70px auto; text-align:center; }
  .gate .pellet{ margin:0 auto 18px; width:52px; height:52px; }
  .gate h2{ font-size:20px; margin-bottom:10px; }
  .gate p{ color:var(--muted); font-size:13.5px; line-height:1.6; margin-bottom:18px; }
  .gate .path-box{ background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px 14px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text); word-break:break-all; margin-bottom:18px; text-align:left; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  #print-area{ display:none; }
  .print-title{ font-family:'Space Grotesk',sans-serif; font-size:20px; margin-bottom:4px; }
  .print-sub{ color:#555; font-size:12px; margin-bottom:16px; }
  .print-summary{ display:flex; gap:28px; margin-bottom:18px; flex-wrap:wrap; }
  .print-summary div{ font-size:12.5px; color:#333; }
  .print-summary b{ display:block; font-size:19px; color:#111; margin-top:2px; }
  @media print {
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{ position:absolute; left:0; top:0; width:100%; display:block !important; background:#fff; padding:10px; }
    #print-area table{ border-collapse:collapse; width:100%; margin-bottom:14px; }
    #print-area th, #print-area td{ border:1px solid #999; padding:4px 6px; font-size:10.5px; color:#000; text-align:left; }
    #print-area h2{ color:#000; font-size:13px; margin:14px 0 6px; }
  }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }

  /* ============================================================
     MOBİL EKRANA ÖZEL DÜZENLEMELER (sadece bu dosyada, masaüstü index.html'de YOK) — dar
     ekranlarda sabit 230px'lik yan menü çok yer kaplayıp her şeyi sıkıştırdığı için, yan menüyü
     "kaydırmalı gizli menü" (hamburger) haline getirir, tabloları/kartları tek sütuna indirir,
     yazı boyutlarını küçültür.
     ============================================================ */
  @media (max-width: 780px){
    #mobil_menu_btn{ display:flex !important; }
    .shell{ display:block; }
    .birim-sidebar{
      position:fixed; top:0; left:0; height:100vh; z-index:150; width:250px;
      transform:translateX(-100%); transition:transform .22s ease; box-shadow:3px 0 22px rgba(0,0,0,.45);
    }
    body.mobil-menu-acik .birim-sidebar{ transform:translateX(0); }
    body.mobil-menu-acik #mobil_menu_backdrop{ display:block; }
    .app-area{ width:100%; height:100vh; }
    .app{ padding:64px 12px 40px; max-width:100%; }
    .topbar{ gap:10px; }
    .topbar h1{ font-size:16px; }
    .topbar .sub{ font-size:11px; }
    .whoami{ font-size:11px; }
    nav.tabs{ top:0; }
    nav.tabs button{ padding:9px 11px; font-size:12.5px; }
    .grid-3, .grid-2{ grid-template-columns:1fr; gap:10px; }
    .card{ padding:13px; overflow-x:auto; }
    .stat{ font-size:21px; }
    table{ font-size:11px; min-width:520px; }
    th, td{ padding:6px 7px; }
    .row{ flex-direction:column; gap:0; }
    .toolbar{ gap:8px; }
    .toolbar .field{ min-width:0; width:100%; }
    .modal{ max-width:94vw; padding:16px; }
    .section-title{ font-size:13px; margin:16px 0 8px; }
  }
  @media (min-width: 781px){
    #mobil_menu_btn, #mobil_menu_backdrop{ display:none !important; }
  }
</style>
</head>
<body>
<!-- Hamburger menü butonu ve arka plan karartması: BİLEREK #root'un DIŞINDA duruyor — app.js her
     ekran değişiminde #root'un içeriğini TAMAMEN YENİDEN YAZIYOR, eğer bu buton #root'un içinde
     olsaydı her ekran değişiminde silinip kaybolurdu. Sadece dar ekranlarda (yukarıdaki CSS ile) görünür. -->
<button id="mobil_menu_btn" aria-label="Menü" style="display:none; position:fixed; top:12px; left:12px; z-index:200; width:42px; height:42px; border-radius:9px; background:var(--panel); border:1px solid var(--line); color:var(--text); font-size:20px; align-items:center; justify-content:center; cursor:pointer;">☰</button>
<div id="mobil_menu_backdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:120;"></div>
<!-- MOBIL_SALT_OKUNUR bayrağı, app.js YÜKLENMEDEN ÖNCE ayarlanmalı — aksi halde app.js kendi
     sonundaki otomatik boot() çağrısını (Electron masaüstü davranışı) hemen çalıştırır, ama
     mobilde henüz Google Drive'dan veri inmemiş olur. Bu yüzden bu satır, diğer TÜM script
     etiketlerinden ÖNCE gelir. -->
<script>window.MOBIL_SALT_OKUNUR = true;</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<div id="root">
  <div class="gate"><div class="pellet"></div><h2>Yükleniyor…</h2></div>
</div>
<div id="print-area"></div>
<script src="web-api.js"></script>
<script src="app.js"></script>
<script src="mobile-bootstrap.js"></script>
<script>
  // Hamburger menü aç/kapa. document'e bağlı (app.js'in #root'u yeniden yazmasından ETKİLENMEZ).
  (function(){
    var menuBtn = document.getElementById('mobil_menu_btn');
    var backdrop = document.getElementById('mobil_menu_backdrop');
    function menuKapat(){ document.body.classList.remove('mobil-menu-acik'); }
    menuBtn.addEventListener('click', function(){ document.body.classList.toggle('mobil-menu-acik'); });
    backdrop.addEventListener('click', menuKapat);
    // Yan menüdeki bir birime/butona tıklanınca menüyü otomatik kapat (ekran değişikliği zaten
    // gerçekleşiyor, açık kalmasının bir anlamı yok). Olay yakalama (delegation) document'e
    // bağlandığı için app.js'in yan menüyü yeniden çizmesinden etkilenmez.
    document.addEventListener('click', function(ev){
      if(ev.target.closest && ev.target.closest('.birim-sidebar')){
        setTimeout(menuKapat, 180);
      }
    });
  })();
</script>
<script>
  // PWA yüklenebilirliği (Ana Ekrana Ekle) için basit bir servis çalışanı kaydı.
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){ /* servis çalışanı olmadan da uygulama çalışır, sorun değil */ });
    });
  }
</script>
</body>
</html>
